[[rule]]
id = "app.wechat-4-0-radium"
name = "WeChat 4.0 Radium Cache (xwechat)"
category = "AppCache"
safety = "Caution"
path = '{ROAMING}\Tencent\xwechat\radium'
description = "微信 4.0 小程序/渲染缓存。删除后小程序需重新加载，不影响聊天记录。"
evidence = 'radium 是小程序与内嵌页面的运行期缓存；聊天数据库与已接收文件在 xwechat 的其他子目录，不在此路径内。'
