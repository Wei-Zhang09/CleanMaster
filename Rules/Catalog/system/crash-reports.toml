# 由硬编码规则迁移而来。


[[rule]]
id = "app.crash-dumps"
name = "Crash Dumps"
category = "CrashDumps"
safety = "Safe"
path = '{LOCAL}\CrashDumps'
description = "应用程序崩溃转储文件。包含崩溃时的内存快照，普通用户可安全删除。"
evidence = '崩溃转储与 Windows 错误报告是故障发生时的诊断快照；删除后历史诊断信息丢失，但不影响系统运行与已安装程序。'
verified_at = "2026-11-05"

