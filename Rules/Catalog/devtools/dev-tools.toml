# 开发工具缓存（RC-6 迁移批次 5）
#
# 21 条静态路径 + 3 条需要枚举子目录的规则（JetBrains 多版本、VS Code 多扩展、Docker 多子目录）。
# 动态部分用命名解析器：children-subdir / children-subdirs / parent-subdirs。
#
# 边界：只清理下载缓存、索引、日志、临时目录；不碰已安装的包、项目源码与个人设置。


[[rule]]
id = "devtools.gradle-caches"
name = "Gradle Caches"
category = "DevToolCache"
safety = "Safe"
path = '{USER}\.gradle\caches'
description = "Gradle 构建工具的下载缓存。下次构建会重新从网络下载依赖，可能耗时较长。"
evidence = '这是包管理器的下载/解压缓存目录；删除后下次构建或安装会重新下载，已安装的包与项目源码不在其中。'
verified_at = "2026-11-05"

[[rule]]
id = "devtools.gradle-daemon-logs"
name = "Gradle Daemon Logs"
category = "DevToolCache"
safety = "Safe"
path = '{USER}\.gradle\daemon'
description = "Gradle daemon 进程日志。Gradle 后台进程运行时产生的日志，可安全删除。"
evidence = '这是工具产生的历史日志目录，仅用于事后排查；工具会按需新建。'
verified_at = "2026-11-05"

