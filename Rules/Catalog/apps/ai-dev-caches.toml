# AI 与开发助手缓存（RC-6 迁移批次 6-A）
#
# 每条只清理明确的缓存/日志子目录，不扫应用根目录（避免误删配置与聊天数据库）。


[[rule]]
id = "app.codex-temp"
name = "Codex Temp"
category = "AppCache"
safety = "Safe"
path = '{USER}\.codex\.tmp'
description = "OpenAI Codex CLI 临时文件。"
evidence = '这是 AI 编程助手的缓存/索引/日志目录，删除后助手会按需重建索引；项目代码与会话记录不在这些路径内（不确定时请保留）。'
verified_at = "2026-11-05"

