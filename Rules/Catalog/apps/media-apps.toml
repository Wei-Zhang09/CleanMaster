# media-apps.toml（RC-6 迁移批次）
#
# 由硬编码规则迁移而来；多路径规则用 paths = [...] 表达。


[[rule]]
id = "app.aliyunpan-cache"
name = "AliyunPan (阿里云盘) Cache"
category = "AppCache"
safety = "Safe"
paths = ['{LOCAL}\Alibaba\AliyunPan\Cache', '{LOCAL}\Alibaba\AliyunPan\GPUCache', '{LOCAL}\Alibaba\AliyunPan\logs', '{LOCAL}\Alibaba\AliyunPan\tmp']
description = "阿里云盘客户端缓存。删除后下次访问文件会重新加载缩略图。"
evidence = '这些是视频/音乐/网盘客户端的缓存子目录；下载的文件、账号与播放记录存放在其他路径，删除后客户端会按需重建缓存。'
verified_at = "2026-11-05"

