# 浏览器缓存（RC-6 迁移批次 4，首个使用命名解析器的批次）
#
# Chromium 系浏览器（Edge/Chrome/Brave/Vivaldi）的缓存都在 User Data\<profile>\<子目录> 下，
# profile 数量因用户而异，所以路径必须运行时枚举 —— 这里用 resolver + 参数表达，
# 解析逻辑在 Rules/Data/RuleResolvers.cs（chromium-profile-subdir）。
#
# 不清理的内容：书签、密码、历史、Cookie、扩展、登录状态都在这条路径之外。

[[rule]]
id = "browser.edge.cache"
name = "Edge Cache (all profiles)"
category = "BrowserCache"
safety = "Safe"
resolver = "chromium-profile-subdir"
description = "Microsoft Edge 浏览器缓存（所有用户配置）。包含网页图片、脚本、样式等资源。删除后下次访问页面会重新从网络加载。"
evidence = 'Cache 目录存放网页资源的本地副本，浏览器按 HTTP 缓存策略重建；不包含 Cookie、历史、书签与登录状态。'
verified_at = "2026-11-05"

[rule.resolver_args]
user_data = '{LOCAL}\Microsoft\Edge\User Data'
sub = "Cache"

[[rule]]
id = "browser.edge.code-cache"
name = "Edge Code Cache (all profiles)"
category = "BrowserCache"
safety = "Safe"
resolver = "chromium-profile-subdir"
description = "Microsoft Edge JavaScript 代码缓存。Edge 编译后的 JS 代码缓存，删除后网页首次打开略慢，会自动重建。"
evidence = 'Code Cache 是 V8 编译后的字节码缓存，浏览器会按需重新编译；删除只影响首次加载速度。'
verified_at = "2026-11-05"

[rule.resolver_args]
user_data = '{LOCAL}\Microsoft\Edge\User Data'
sub = "Code Cache"

[[rule]]
id = "browser.edge.gpu-cache"
name = "Edge GPUCache (all profiles)"
category = "BrowserCache"
safety = "Safe"
resolver = "chromium-profile-subdir"
description = "Microsoft Edge GPU 着色器缓存。GPU 渲染网页时编译的着色器，删除后游戏/视频首帧渲染略慢。"
evidence = 'GPUCache 存 GPU 着色器与图形管线缓存，属可重建的编译产物。'
verified_at = "2026-11-05"

[rule.resolver_args]
user_data = '{LOCAL}\Microsoft\Edge\User Data'
