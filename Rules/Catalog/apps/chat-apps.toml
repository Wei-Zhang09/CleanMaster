[[rule]]
id = "app.slack-cache"
name = "Slack Cache"
category = "AppCache"
safety = "Safe"
resolver = "children-subdirs"
description = "Slack 桌面客户端缓存。删除后工作区数据会重新加载。"
evidence = 'Slack 按版本目录存放客户端，这里只清每个版本下的 Cache/GPUCache/Code Cache；工作区数据与登录状态在别处。'
