[[rule]]
id = "app.thumbnail-cache"
name = "缩略图缓存"
category = "AppCache"
safety = "Safe"
path = '{LOCAL}\Microsoft\Windows\Explorer'
patterns = ["iconcache_*.db", "thumbcache_*.db"]
patterns_are_directories = false
description = "文件资源管理器缩略图缓存。删除后浏览图片/视频文件夹时会自动重建，首次浏览略慢。"
evidence = '这些是应用缓存、缩略图/图标缓存或「最近访问」快捷方式目录；原始文件与配置不在其中，删除后系统或应用会按需重建。'
verified_at = "2026-11-05"
