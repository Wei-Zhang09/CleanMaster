# misc-apps.toml（RC-6 迁移批次）
#
# 由硬编码规则迁移而来；多路径规则用 paths = [...] 表达。


[[rule]]
id = "app.115-cache"
name = "115 网盘 Cache"
category = "AppCache"
safety = "Safe"
paths = ['{LOCAL}\115\Cache', '{LOCAL}\115\GPUCache', '{LOCAL}\115\logs']
description = "115 网盘客户端缓存。删除后下次访问文件会重新加载缩略图。"
evidence = '这些是应用缓存、缩略图/图标缓存或「最近访问」快捷方式目录；原始文件与配置不在其中，删除后系统或应用会按需重建。'
verified_at = "2026-11-05"

[[rule]]
id = "app.baidu-netdisk-cache"
name = "Baidu Netdisk (百度网盘) Cache"
category = "AppCache"
safety = "Safe"
paths = ['{LOCAL}\BaiduNetdisk\Cache', '{LOCAL}\BaiduNetdisk\GPUCache', '{LOCAL}\BaiduNetdisk\logs', '{LOCAL}\BaiduNetdisk\tmp']
description = "百度网盘客户端缓存。删除后下次访问文件会重新加载缩略图，下载中的文件不会被删除。"
evidence = '这些是应用缓存、缩略图/图标缓存或「最近访问」快捷方式目录；原始文件与配置不在其中，删除后系统或应用会按需重建。'
verified_at = "2026-11-05"

