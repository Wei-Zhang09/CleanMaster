# chat-apps.toml（RC-6 迁移批次）
#
# 由硬编码规则迁移而来；多路径规则用 paths = [...] 表达。


[[rule]]
id = "app.qq-cache"
name = "QQ Cache"
category = "AppCache"
safety = "Safe"
paths = ['{ROAMING}\Tencent\QQ\Cache', '{ROAMING}\Tencent\QQ\GPUCache', '{ROAMING}\Tencent\QQ\Code Cache', '{ROAMING}\Tencent\QQ\logs', '{ROAMING}\Tencent\QQ\Temp']
description = "QQ 缓存子目录。删除不影响聊天记录，下次使用时缓存会重新生成。"
evidence = '这些是聊天/视频客户端的缓存子目录；聊天记录、文件与账号配置存放在其他路径，删除后客户端会按需重建缓存。'
verified_at = "2026-11-05"

