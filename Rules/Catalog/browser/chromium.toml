[[rule]]
id = "browser.webcache"
name = "WebCache"
category = "BrowserCache"
safety = "Caution"
path = '{LOCAL}\Microsoft\Windows\WebCache'
description = "WinINet WebCache 数据库。可能包含 IE/Edge 历史记录索引。建议关闭浏览器后清理，否则可能被占用无法删除。"
evidence = 'WebCache 目录里的数据库同时保存缓存索引与部分历史记录索引，删除后索引会重建但历史记录视图可能受影响，因此标 Caution 并提示关闭浏览器。'
verified_at = "2026-11-05"
