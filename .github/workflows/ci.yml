name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity minimal --logger "trx;LogFileName=testresults.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "**/testresults.trx"

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: coverage

  publish:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish (self-contained single file)
      run: dotnet publish CleanMaster.csproj -c Release -r win-x64 --self-contained true -o bin\Release\publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: publish
        path: bin\Release\publish

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish (self-contained single file)
      run: dotnet publish CleanMaster.csproj -c Release -r win-x64 --self-contained true -o bin\Release\publish -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Install Inno Setup
      shell: pwsh
      run: |
        if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
          choco install innosetup -y --no-progress
        }

    - name: Read version from tag
      shell: pwsh
      run: |
        $v = "${{ github.ref_name }}".TrimStart('v')
        echo "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

    - name: Build installer
      shell: pwsh
      run: |
        & iscc.exe /DAppVersion=$env:VERSION installer.iss
        Get-ChildItem installer\*.exe

    - name: Build release notes
      shell: pwsh
      run: |
        $prev = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
        if ($LASTEXITCODE -eq 0 -and $prev) { $range = "$prev..${{ github.ref_name }}" }
        else { $range = "${{ github.ref_name }}" }
        $lines = git log $range --pretty=format:"- %s" --no-merges
        $body = "## 更新内容`r`n`r`n" + ($lines -join "`r`n")
        $body | Out-File -FilePath release-notes.md -Encoding utf8
        Get-Content release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: installer/*.exe
        body_path: release-notes.md
